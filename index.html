<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fff7ed;--card:#ffffff;--ink:#3b2a1e;--muted:#9a8574;--pri:#f97316;--pri2:#ea580c;--line:#f1e2cf;--ok:#16a34a;--warn:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Rubik,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(84px + env(safe-area-inset-bottom)) env(safe-area-inset-left);min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px}
#app{max-width:560px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
header.top h1{font-size:22px;margin:0;font-weight:800;flex:1}
header.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.icon-btn{border:none;background:var(--card);width:42px;height:42px;border-radius:14px;font-size:20px;box-shadow:0 2px 0 var(--line)}
.demo{background:#fef3c7;border:1px dashed #f59e0b;color:#92400e;font-size:13px;padding:8px 12px;border-radius:12px;margin:6px 0 4px}
.err{background:#fee2e2;color:#991b1b;font-size:13px;padding:8px 12px;border-radius:12px;margin:6px 0}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 3px 0 var(--line);margin:12px 0}
.hero{display:flex;align-items:center;gap:14px}
.hero .luna{width:84px;height:84px;flex:none}
.hero h2{margin:0 0 6px;font-size:19px}
.paws{display:flex;gap:6px;font-size:22px}
.paws span{filter:grayscale(1);opacity:.25;transition:.3s}
.paws span.on{filter:none;opacity:1;animation:pop .5s}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.hint b{color:var(--ink)}
.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin:12px 0}
.btn{border:none;border-radius:18px;padding:16px 12px;font-size:17px;font-weight:700;background:var(--card);box-shadow:0 3px 0 var(--line)}
.btn.pri{background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri2)}
.btn.pri:active,.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted);font-weight:500;font-size:15px}
.btn.danger{background:#fee2e2;color:var(--warn);box-shadow:none}
.btn.wide{width:100%}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{position:relative;border:2px solid var(--line);background:var(--card);border-radius:22px;padding:12px;min-height:158px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.slot-top{width:100%;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.slot.done{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.slot.todo{border-style:dashed;color:var(--muted)}
.slot.now{border-color:var(--pri);color:var(--ink);animation:glow 2s ease-in-out infinite}
.nowtag{background:var(--pri);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.extra{background:var(--c);color:#fff;font-size:11px;padding:2px 7px;border-radius:99px}
.thumb{width:66px;height:66px;border-radius:50%;object-fit:cover;border:3px solid var(--c);background:#f5ece2}
.avatar{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;width:30px;height:30px;font-size:15px;flex:none}
.avatar.big{width:66px;height:66px;font-size:30px}
.slot .who{font-weight:700;font-size:16px}
.slot .when{font-size:12px;color:var(--muted)}
.paw-empty{font-size:38px;opacity:.35;height:66px;display:grid;place-items:center}
/* live */
.live{background:linear-gradient(160deg,#fff,#ffedd5);border:2px solid var(--pri);text-align:center;overflow:hidden}
.live .timer{font-size:44px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;direction:ltr}
.stage{position:relative;height:120px;margin:4px -16px 0;overflow:hidden}
.ground{position:absolute;bottom:8px;left:0;right:0;height:22px;
  background-image:radial-gradient(circle at 10px 11px,#e7c9a4 5px,transparent 6px),radial-gradient(circle at 34px 6px,#e7c9a4 3px,transparent 4px);
  background-size:60px 22px;animation:ground 1s linear infinite}
.walker-dog{position:absolute;bottom:18px;left:50%;width:150px;margin-left:-75px}
.walker-dog .dog{animation:bob .5s ease-in-out infinite alternate}
.leg{transform-box:fill-box;transform-origin:50% 8%;animation:step .5s ease-in-out infinite alternate}
.l1,.l4{animation-delay:-.5s}
.tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag .25s ease-in-out infinite alternate}
/* fairness */
.seg{display:flex;background:#f3e6d6;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;padding:9px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}
.lb-row{display:grid;grid-template-columns:26px 34px 1fr auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lb-row:last-child{border:none}
.medal{font-size:20px;text-align:center}
.lb-name{font-weight:700;display:flex;justify-content:space-between;font-size:15px}
.bar{height:12px;background:#f3e6d6;border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .6s}
.diff{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.diff.plus{background:#dcfce7;color:var(--ok)}
.diff.minus{background:#fee2e2;color:var(--warn)}
.diff.even{background:#f3e6d6;color:var(--muted)}
h3{margin:0 0 10px;font-size:17px}
.heat{display:grid;grid-template-columns:70px repeat(4,1fr);gap:5px;align-items:center}
.heat .hd{font-size:12px;color:var(--muted);text-align:center}
.heat .dl{font-size:13px;font-weight:500}
.cell{height:34px;border-radius:9px;border:none;font-weight:800;color:#fff;font-size:14px;display:grid;place-items:center}
.cell.empty{background:#f6ede2;color:#d9c6b1;font-weight:500}
.cell.future{background:transparent;border:1px dashed #eadbc8;color:transparent}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:13px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
table.mx{width:100%;border-collapse:collapse;font-size:14px;text-align:center}
table.mx th{font-weight:500;color:var(--muted);font-size:12px;padding:4px}
table.mx td{padding:6px 4px;border-top:1px solid var(--line)}
table.mx td:first-child{text-align:right;font-weight:700}
.mxc{display:inline-block;min-width:26px;padding:2px 6px;border-radius:8px}
/* album */
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.album button{border:none;padding:0;position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#f3e6d6}
.album img{width:100%;height:100%;object-fit:cover;display:block}
.album .cap{position:absolute;bottom:0;left:0;right:0;font-size:11px;color:#fff;padding:12px 6px 4px;background:linear-gradient(transparent,rgba(0,0,0,.6));text-align:right}
.empty-state{text-align:center;color:var(--muted);padding:30px 10px}
.empty-state .big{font-size:54px}
.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meal{border:2px dashed var(--line);background:#fff;border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.meal .mi{font-size:30px}
.meal b{font-size:15px}
.meal .ms{font-size:12px;color:var(--muted)}
.meal.done{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.meal.done .ms{color:var(--ink);font-weight:500}
.meal.due{border-color:var(--pri);animation:glow 2s ease-in-out infinite}
.meal.due .ms{color:var(--pri2);font-weight:700}
.meal.late{border-color:var(--warn);border-style:solid;background:#fff1f1}
.meal.late .ms{color:var(--warn);font-weight:700}
.feedlog{margin-top:12px}
.mnote{font-size:11px;color:var(--ink);opacity:.75;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.chip:disabled{opacity:.55;cursor:default}
.fam{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.feedlog summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.cell.miss{background:#fee2e2;color:var(--warn)}
.big-emoji{font-size:110px;animation:jump .5s ease-in-out infinite alternate}
/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{flex:1;max-width:180px;border:none;background:none;padding:6px;border-radius:14px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:22px}
nav.tabs button.on{color:var(--pri2);background:#fff1e3}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(40,25,10,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .25s ease-out}
.grab{width:44px;height:5px;background:#e3d2bf;border-radius:9px;margin:0 auto 10px}
.sheet h2{margin:0 0 12px;font-size:21px}
.field{margin:12px 0}
.field label.l{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip.on{background:var(--c,var(--pri));border-color:var(--c,var(--pri));color:#fff}
.chip.on .dot{background:#fff}
.inp{width:100%;border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-box{display:flex;align-items:center;gap:12px}
.photo-box img{width:84px;height:84px;object-fit:cover;border-radius:16px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.photo-pick{border:2px dashed #e3cdb4;background:#fff;border-radius:16px;padding:14px;font-weight:700;font-size:15px;flex:1}
.sheet-actions{display:grid;gap:8px;margin-top:16px}
.dlg{background:#fff;border-radius:22px;padding:20px;margin:auto 16px;max-width:400px;width:100%;text-align:center;animation:pop .25s}
.dlg p{font-size:16px;line-height:1.5;margin:4px 0 16px}
.dlg .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff;animation:fade .2s}
.viewer img{max-width:100%;max-height:70vh;border-radius:16px}
.viewer .vc{margin:14px 0;text-align:center;font-size:15px}
.viewer .vb{display:flex;gap:10px}
.viewer .vb button{border:none;border-radius:14px;padding:10px 18px;font-weight:700;background:rgba(255,255,255,.15);color:#fff}
/* setup */
.setup{text-align:center;padding-top:8vh}
.setup .luna{width:130px;height:130px;animation:wiggle 2.5s ease-in-out infinite}
.setup h1{font-size:26px;margin:10px 0 4px}
.setup p{color:var(--muted);margin:0 0 20px}
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who-grid button{border:none;border-radius:20px;padding:18px 10px;background:#fff;box-shadow:0 3px 0 var(--line);font-size:18px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:8px}
/* toast & celebration */
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;z-index:60;animation:pop .25s;max-width:90vw;text-align:center}
.party{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,247,237,.88);overflow:hidden;animation:fade .2s}
.party .luna{width:150px;height:150px;animation:jump .6s ease-in-out infinite alternate}
.party h2{font-size:26px;margin:16px 20px 4px;text-align:center}
.party p{color:var(--muted);margin:0}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
.flypaw{position:absolute;font-size:26px;animation:floatup 2.2s ease-out forwards}
img.luna{border-radius:50%;object-fit:cover;display:block}
.setup img.luna,.party img.luna{margin:0 auto}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.toast{animation:toastIn .25s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.0)}50%{box-shadow:0 0 0 6px rgba(249,115,22,.18)}}
@keyframes ground{from{background-position:0 0}to{background-position:-60px 0}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes step{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}
@keyframes jump{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-34px) rotate(4deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes ears{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg) translateY(-2px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes floatup{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-60vh) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

/* ---------- data store (Supabase או מצב הדגמה מקומי) ---------- */
const META = 'id,walk_date,slot,walker,started_at,ended_at,status,note,has_photo,created_at';
const Store = {
  mode:'demo', sb:null, photoCache:{}, _mem:null,
  configured(){ return !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase); },
  connect(key, parentKey){
    const headers={'x-family-key':key}; if(parentKey) headers['x-parent-key']=parentKey;
    this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY,
      {auth:{persistSession:false}, global:{headers}});
    this.mode='cloud';
  },
  async getSettings(){
    const def={participants:WALKERS.map(w=>w.id)}; let v={};
    if(this.mode==='cloud'){
      const {data,error}=await this.sb.from('app_settings').select('value').eq('key','family').maybeSingle();
      if(!error && data) v=data.value||{};
    } else v=LS.get('luna_demo_settings',{});
    const s={...def,...v}; s.participants=(s.participants||[]).filter(id=>WALKERS.some(w=>w.id===id));
    if(!s.participants.length) s.participants=def.participants; return s;
  },
  async saveSettings(v,by){
    if(this.mode==='cloud'){
      const {error}=await this.sb.from('app_settings').upsert({key:'family', value:v, updated_by:by, updated_at:new Date().toISOString()});
      if(error) throw error; return;
    }
    LS.set('luna_demo_settings',v);
  },
  async checkKey(){ const {data,error}=await this.sb.rpc('is_family'); if(error) throw error; return data===true; },
  _load(){ if(!this._mem){ this._mem = LS.get('luna_demo',null) || seedDemo(); this._save(); } return this._mem; },
  _save(){ if(!LS.set('luna_demo',this._mem)) console.warn('local storage unavailable / full'); },
  _strip(w){ const {photo,...m}=w; return {...m, has_photo:!!photo}; },
  async list(from){
    if(this.mode==='cloud'){
      const {data,error}=await this.sb.from('walks').select(META).gte('walk_date',from)
        .order('walk_date',{ascending:false}).order('created_at',{ascending:true});
      if(error) throw error; return data;
    }
    return this._load().filter(w=>w.walk_date>=from).map(w=>this._strip(w))
      .sort((a,b)=> b.walk_date.localeCompare(a.walk_date) || a.created_at.localeCompare(b.created_at));
  },
  async photoWalks(limit=90){
    if(this.mode==='cloud'){
      const {data,error}=await this.sb.from('walks').select(META).eq('has_photo',true)
        .order('walk_date',{ascending:false}).order('created_at',{ascending:false}).limit(limit);
      if(error) throw error; return data;
    }
    return this._load().filter(w=>w.photo).map(w=>this._strip(w))
      .sort((a,b)=> b.walk_date.localeCompare(a.walk_date) || b.created_at.localeCompare(a.created_at)).slice(0,limit);
  },
  async add(w){
    if(this.mode==='cloud'){
      const {data,error}=await this.sb.from('walks').insert(w).select(META).single();
      if(error) throw error; if(w.photo) this.photoCache[data.id]=w.photo; return data;
    }
    const row={...w, id:uuid(), created_at:new Date().toISOString()};
    this._load().push(row); this._save(); if(w.photo) this.photoCache[row.id]=w.photo; return this._strip(row);
  },
  async update(id,patch){
    if(this.mode==='cloud'){
      const {data,error}=await this.sb.from('walks').update(patch).eq('id',id).select(META).single();
      if(error) throw error;
      if('photo' in patch){ if(patch.photo) this.photoCache[id]=patch.photo; else delete this.photoCache[id]; }
      return data;
    }
    const row=this._load().find(w=>w.id===id); if(!row) throw new Error('not found');
    Object.assign(row,patch); this._save();
    if('photo' in patch){ if(patch.photo) this.photoCache[id]=patch.photo; else delete this.photoCache[id]; }
    return this._strip(row);
  },
  async remove(id){
    if(this.mode==='cloud'){ const {error}=await this.sb.from('walks').delete().eq('id',id); if(error) throw error; }
    else { this._mem=this._load().filter(w=>w.id!==id); this._save(); }
    delete this.photoCache[id];
  },
  /* --- feedings --- */
  _loadF(){ if(!this._memF){ this._memF = LS.get('luna_demo_feed',null) || seedDemoFeed(); this._saveF(); } return this._memF; },
  _saveF(){ LS.set('luna_demo_feed',this._memF); },
  async listFeed(from){
    if(this.mode==='cloud'){
      const {data,error}=await this.sb.from('feedings').select('*').gte('feed_date',from).order('created_at',{ascending:true});
      if(error) throw error; return data;
    }
    return this._loadF().filter(f=>f.feed_date>=from).map(f=>({...f}));
  },
  async addFeed(f){
    if(this.mode==='cloud'){
      let {data,error}=await this.sb.from('feedings').insert(f).select('*').single();
      if(error && /note/.test(error.message||'') && 'note' in f){ const {note,...g}=f; ({data,error}=await this.sb.from('feedings').insert(g).select('*').single()); if(!error) toast('ההערה לא נשמרה – צריך להריץ את קובץ העדכון ב-Supabase'); }
      if(error) throw error; return data; }
    const row={...f, id:uuid(), created_at:new Date().toISOString()}; this._loadF().push(row); this._saveF(); return row;
  },
  async updateFeed(id,p){
    if(this.mode==='cloud'){ const {data,error}=await this.sb.from('feedings').update(p).eq('id',id).select('*').single(); if(error) throw error; return data; }
    const row=this._loadF().find(f=>f.id===id); Object.assign(row,p); this._saveF(); return row;
  },
  async removeFeed(id){
    if(this.mode==='cloud'){ const {error}=await this.sb.from('feedings').delete().eq('id',id); if(error) throw error; return; }
    this._memF=this._loadF().filter(f=>f.id!==id); this._saveF();
  },
  async photos(ids){
    const need=ids.filter(id=>!(id in this.photoCache)); if(!need.length) return;
    if(this.mode==='cloud'){
      for(let i=0;i<need.length;i+=12){
        const {data,error}=await this.sb.from('walks').select('id,photo').in('id',need.slice(i,i+12));
        if(error) throw error; data.forEach(r=>{ this.photoCache[r.id]=r.photo; });
      }
    } else {
      need.forEach(id=>{ const r=this._load().find(w=>w.id===id); this.photoCache[id]=r?r.photo:null; });
    }
  },
};
function seedDemo(){
  const out=[]; const t=todayL(); const now=logicalNow();
  const weights={abba:3,ima:4,guli:3,guy:2,michi:2.5};
  const pick=()=>{ const tot=Object.values(weights).reduce((a,b)=>a+b,0); let r=Math.random()*tot;
    for(const [k,v] of Object.entries(weights)){ if((r-=v)<0) return k; } return 'ima'; };
  const hours={morning:7,noon:12,afternoon:16,night:21};
  for(let i=13;i>=0;i--){
    const day=addDays(t,-i);
    for(const s of SLOTS){
      if(i===0 && SLOT_ORDER[s.id]>=SLOT_ORDER[now.slot]) continue;
      if(Math.random()<0.1) continue;
      const st=parseYmd(day); st.setHours(hours[s.id], Math.floor(Math.random()*50));
      const live=Math.random()<0.6; const en=new Date(st.getTime()+(10+Math.random()*25)*60000);
      out.push({id:uuid(), walk_date:day, slot:s.id, walker:pick(), started_at:st.toISOString(),
        ended_at: live?en.toISOString():null, status:'done', note:null, photo:null, created_at:st.toISOString()});
    }
  }
  return out;
}

function seedDemoFeed(){
  const out=[]; const t=todayL(); const nh=nowHour(); const ids=WALKERS.map(w=>w.id);
  for(let i=8;i>=0;i--){ const day=addDays(t,-i);
    for(const m of MEALS){
      if(i===0 && m.from>nh) continue;
      if(i>0 && Math.random()<0.07) continue;
      if(i===0 && m.from+1>nh) continue;
      const d=parseYmd(day); const hh=m.from+Math.random()*1.2; d.setHours(Math.floor(hh), Math.floor((hh%1)*60));
      out.push({id:uuid(), feed_date:day, meal:m.id, fed_by:ids[Math.floor(Math.random()*ids.length)], fed_at:d.toISOString(), created_at:d.toISOString()});
    } }
  return out;
}

/* ---------- photo ---------- */
function compressImage(file, max=720, q=0.72){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('לא הצלחתי לקרוא את התמונה')); };
    img.src=url;
  });
}
async function hydratePhotos(root){
  const imgs=[...root.querySelectorAll('img[data-photo]')].filter(i=>!i.getAttribute('src'));
  if(!imgs.length) return;
  try{ await Store.photos([...new Set(imgs.map(i=>i.dataset.photo))]); }catch(e){ console.warn(e); }
  imgs.forEach(i=>{ const p=Store.photoCache[i.dataset.photo]; if(p) i.src=p; });
}

function countsSince(from){

    const last=mine.reduce((m,w)=> (w.walk_date+SLOT_ORDER[w.slot])>m ? (w.walk_date+SLOT_ORDER[w.slot]) : m, '');
    return {p, n:mine.length, last}; });
}

function streak(){
  const ws=doneWalks(); const full=d=> new Set(ws.filter(w=>w.walk_date===d).map(w=>w.slot)).size===4;
  let d=todayL(), n=0; if(full(d)) n++; d=addDays(d,-1);
  while(full(d) && n<400){ n++; d=addDays(d,-1); }
  return n;
}

function miniParty(emoji,title,sub){

function renderFair(){
  const R=state.range, t=todayL(), from=addDays(t,-(R-1)), now=logicalNow();
  const ws=doneWalks().filter(w=>w.walk_date>=from);
  const parts=participants(), partIds=new Set(parts.map(p=>p.id));

  const rows=parts.map(p=>{ const mine=ws.filter(w=>w.walker===p.id);
    const mins=mine.map(durMin).filter(Boolean);
    return {p, n:mine.length, slots:SLOTS.map(s=>mine.filter(w=>w.slot===s.id).length),
      avg: mins.length? Math.round(mins.reduce((a,b)=>a+b,0)/mins.length):null}; });
  const total=ws.length, ptotal=rows.reduce((a,r)=>a+r.n,0), fair=ptotal/Math.max(1,parts.length), max=Math.max(1,...rows.map(r=>r.n));
  // possible slots so far
  let possible=0; for(let i=0;i<R;i++){ const d=addDays(t,-i); possible += d===now.date ? SLOT_ORDER[now.slot]+1 : 4; }
  const covered=new Set(ws.map(w=>w.walk_date+'|'+w.slot)).size;

    <div class="stat"><b>${total}</b><span>יציאות</span></div>
    <div class="stat"><b>${possible?Math.min(100,Math.round(covered/possible*100)):0}%</b><span>מהיציאות בוצעו</span></div>
    <div class="stat"><b>${Math.max(0,possible-covered)}</b><span>יציאות חסרות</span></div>

    ${sorted.map((r,i)=>{ const diff=Math.round((r.n-fair)*10)/10;
      const cls= Math.abs(diff)<0.5?'even':diff>0?'plus':'minus';

      return `<div class="lb-row" style="--c:${r.p.color}">
        <div class="medal">${r.n>0&&i<3?medals[i]:''}</div>
        <span class="avatar" style="background:${r.p.color}">${esc(r.p.name[0])}</span>
        <div><div class="lb-name"><span>${esc(r.p.name)}</span><span>${r.n}${r.avg?` <small style="color:var(--muted);font-weight:500">· ~${r.avg} דק׳</small>`:''}</span></div>
          <div class="bar"><i style="width:${r.n/max*100}%"></i></div></div>
        <span class="diff ${cls}">${ptotal?lbl:'—'}</span>
      </div>`; }).join('')}
    <div class="hint">חלק הוגן: ${Math.round(fair*10)/10} יציאות לכל אחד${others.length?`<br>לא משתתפים בטבלה: ${others.map(o=>`${esc(o.p.name)} (${o.n})`).join(', ')}`:''}</div>
  </section>
  <section class="card"><h3>📅 מי הוציא ומתי</h3>
    <div class="heat"><div></div>${SLOTS.map(s=>`<div class="hd">${s.icon}<br>${s.name}</div>`).join('')}
    ${Array.from({length:R},(_,i)=>addDays(t,-i)).map(d=>`<div class="dl">${dayLabel(d)}</div>`+SLOTS.map(s=>{
      const w=ws.find(x=>x.walk_date===d&&x.slot===s.id);
      if(w){ const p=W(w.walker); return `<button class="cell" style="background:${p.color}" data-walk="${w.id}" title="${esc(p.name)}">${esc(p.name[0])}</button>`; }
      const future = d===now.date && SLOT_ORDER[s.id]>SLOT_ORDER[now.slot];
      return `<button class="cell ${future?'future':'empty'}" data-add="${d}|${s.id}">${future?'':'+'}</button>`;
    }).join('')).join('')}
    </div>
    <div class="legend">${WALKERS.map(p=>`<span><i style="background:${p.color}"></i>${esc(p.name)}</span>`).join('')}</div>
    <div class="hint">לחיצה על משבצת ריקה = תיעוד בדיעבד · על משבצת צבעונית = עריכה</div>

    <table class="mx"><tr><th></th>${SLOTS.map(s=>`<th>${s.icon} ${s.name}</th>`).join('')}</tr>
    ${rows.map(r=>`<tr><td>${esc(r.p.name)}</td>${r.slots.map(c=>{ const mx=Math.max(1,...rows.map(x=>x.slots[r.slots.indexOf(c)]));
      return `<td><span class="mxc" style="background:${c?`color-mix(in srgb,${r.p.color} ${20+Math.round(c/Math.max(1,Math.max(...rows.flatMap(x=>x.slots)))*60)}%,#fff)`:'transparent'}">${c||'·'}</span></td>`; }).join('')}</tr>`).join('')}
    </table>

function tick(){

function openSheet(mode, opt={}){
  const w=opt.walk||{}; const ln=logicalNow();
  sheet={ mode, id:w.id, walker:w.walker||state.me||WALKERS[0].id,
    date:w.walk_date||opt.date||ln.date, slot:w.slot||opt.slot||ln.slot,
    time: w.started_at?hm(w.started_at):'', note:w.note||'', photo:undefined, hadPhoto:!!w.has_photo, walk:w };
  drawSheet();
}
function closeSheet(){ document.querySelector('.overlay.sheet-o')?.remove(); sheet=null; }

  });

async function saveSheet(btn){
  const m=sheet.mode; btn.disabled=true;
  try{
    if(m==='start'){
      const t=todayL();
      if(doneWalks().some(w=>w.walk_date===t&&w.slot===sheet.slot) &&
         !await confirmDlg(`יציאת ה${S(sheet.slot).name} של היום כבר סומנה. לצאת שוב בכל זאת?`,'כן, יוצאים')) { btn.disabled=false; return; }
      await Store.add({walk_date:t, slot:sheet.slot, walker:sheet.walker, started_at:new Date().toISOString(), status:'live'});
      closeSheet(); toast('טיול נעים! 🐕'); await refresh(); return;
    }
    if(m==='finish'){
      const patch={walker:sheet.walker, note:sheet.note.trim()||null, ended_at:new Date().toISOString(), status:'done'};
      if(sheet.photo!==undefined) patch.photo=sheet.photo;
      const done=await Store.update(sheet.id,patch); closeSheet(); await refresh();
      celebrate(done.walker, durMin(done)?`טיול של ${durMin(done)} דקות`:''); return;
    }
    // past / edit
    if(!sheet.date){ toast('צריך לבחור תאריך'); btn.disabled=false; return; }
    if(sheet.date>ymd(new Date())){ toast('אי אפשר לתעד יציאה בעתיד 🙂'); btn.disabled=false; return; }
    let started=null;
    if(sheet.time){ const d=new Date(sheet.date+'T'+sheet.time); if(sheet.slot==='night' && d.getHours()<4) d.setDate(d.getDate()+1); started=d.toISOString(); }
    const fields={walk_date:sheet.date, slot:sheet.slot, walker:sheet.walker, note:sheet.note.trim()||null};
    if(m==='past'){
      const dup=doneWalks().find(w=>w.walk_date===sheet.date&&w.slot===sheet.slot);
      if(dup && !await confirmDlg(`כבר רשום ש${esc(W(dup.walker).name)} הוציא/ה את לונה ב${S(sheet.slot).name} של ${dayLabel(sheet.date)}. להוסיף יציאה נוספת?`,'להוסיף')) { btn.disabled=false; return; }
      const row={...fields, started_at:started, ended_at:null, status:'done'}; if(sheet.photo) row.photo=sheet.photo;
      const r=await Store.add(row); closeSheet(); await refresh(); celebrate(r.walker,`נרשם: ${S(r.slot).name}, ${dayLabel(r.walk_date)}`); return;
    }
    if(m==='edit'){
      const patch={...fields};
      const origTime = sheet.walk.started_at?hm(sheet.walk.started_at):'';
      if(sheet.time!==origTime || sheet.date!==sheet.walk.walk_date){
        if(started){ patch.started_at=started;
          if(sheet.walk.started_at && sheet.walk.ended_at){ const dur=new Date(sheet.walk.ended_at)-new Date(sheet.walk.started_at); patch.ended_at=new Date(new Date(started).getTime()+dur).toISOString(); } }
        else { patch.started_at=null; patch.ended_at=null; }
      }
      if(sheet.photo!==undefined) patch.photo=sheet.photo;
      await Store.update(sheet.id,patch); closeSheet(); toast('נשמר ✔️');
      if(state.tab==='album') state.album=null; await refresh(); return;
    }
  }catch(e){ console.error(e); toast('שגיאה בשמירה: '+(e.message||e)); btn.disabled=false; }
}

/* ---------- events ---------- */
document.addEventListener('click', async e=>{
  const t=e.target.closest('button'); if(!t) return;
  const d=t.dataset;
  if(d.tab){ state.tab=d.tab; window.scrollTo(0,0); if(d.tab==='album'){ state.album=null; render(); loadAlbum(); } else render(); return; }
  if(d.range){ state.range=+d.range; render(); return; }
  if(d.walker && sheet){ sheet.walker=d.walker; t.parentNode.querySelectorAll('[data-walker]').forEach(b=>b.classList.toggle('on',b===t)); return; }
  if(d.slot && sheet){ sheet.slot=d.slot; t.parentNode.querySelectorAll('[data-slot]').forEach(b=>b.classList.toggle('on',b===t)); return; }
  if(d.me){ state.me=d.me; LS.set('luna_me',d.me); t.closest('.overlay')?.remove(); render(); openSettings(); return; }
  if(d.meal && sheet){ sheet.meal=d.meal; t.parentNode.querySelectorAll('[data-meal]').forEach(b=>b.classList.toggle('on',b===t));
    const nw=document.getElementById('fNoteWrap'); if(nw) nw.hidden=!NOTE_MEALS.includes(d.meal); return; }
  if(d.part){ if(t.disabled) return; t.classList.toggle('on'); return; }
  if(d.feed){ const f=state.feeds.find(x=>x.id===d.feed); if(f) openFeedSheet({feed:f}); return; }
  if(d.feedAdd){ openFeedSheet({meal:d.feedAdd}); return; }
  if(d.feedDay){ const [dt,ml]=d.feedDay.split('|'); openFeedSheet({date:dt, meal:ml}); return; }
  if(d.walk){ const w=state.walks.find(x=>x.id===d.walk); if(w) openSheet('edit',{walk:w}); return; }
  if(d.addSlot){ if(state.live){ openSheet('finish',{walk:state.live}); return; } openSheet('past',{date:todayL(), slot:d.addSlot}); return; }
  if(d.add){ const [dt,sl]=d.add.split('|'); openSheet('past',{date:dt,slot:sl}); return; }
  if(d.view){ openViewer(d.view); return; }
  switch(d.act){
    case 'start': openSheet('start'); break;
    case 'past': openSheet('past'); break;
    case 'finish': if(state.live) openSheet('finish',{walk:state.live}); break;
    case 'save': if(sheet?.kind==='feed') saveFeed(t); else saveSheet(t); break;
    case 'close': if(sheet) closeSheet(); else t.closest('.overlay')?.remove(); break;
    case 'pick': $('#fileInput').value=''; $('#fileInput').click(); break;
    case 'rmphoto': sheet.photo=null; sheet.hadPhoto=false; drawSheet(); break;
    case 'delete': if(await confirmDlg(sheet.kind==='feed'?'למחוק את ההאכלה הזו?':'למחוק את היציאה הזו?','מחיקה')){ try{ if(sheet.kind==='feed') await Store.removeFeed(sheet.id); else await Store.remove(sheet.id); closeSheet(); toast('נמחק'); state.album=null; await refresh(); }catch(err){ toast('שגיאה: '+err.message); } } break;
    case 'cancel-live': if(await confirmDlg('לבטל את הטיול? הוא לא יירשם.','לבטל')){ try{ await Store.remove(sheet.id); closeSheet(); await refresh(); }catch(err){ toast('שגיאה: '+err.message); } } break;
    case 'settings': openSettings(); break;
    case 'save-family': saveFamilySettings(t); break;
    case 'logout': LS.del('luna_family_key'); LS.del('luna_parent_key'); location.reload(); break;
    case 'reset-demo': if(await confirmDlg('לאפס את נתוני ההדגמה?','איפוס')){ LS.del('luna_demo'); LS.del('luna_demo_feed'); Store._mem=null; Store._memF=null; t.closest('.overlay')?.remove(); await refresh(); } break;
  }
});
$('#fileInput').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f||!sheet) return;
  try{ sheet.photo=await compressImage(f); drawSheet(); }catch(err){ toast(err.message); }
});
function openViewer(id){
  const w=(state.album||[]).find(x=>x.id===id); if(!w) return; const p=W(w.walker);
  const o=document.createElement('div'); o.className='viewer';
  o.innerHTML=`<img src="${Store.photoCache[id]||''}" alt=""><div class="vc"><b>${esc(p.name)}</b> · ${S(w.slot).icon} ${S(w.slot).name} · ${dayLabel(w.walk_date)}${w.note?`<br>${esc(w.note)}`:''}</div>
    <div class="vb"><button data-v="edit">עריכה</button><button data-v="close">סגירה</button></div>`;
  o.addEventListener('click',ev=>{ const b=ev.target.closest('[data-v]'); if(ev.target===o||b?.dataset.v==='close'){ o.remove(); }
    if(b?.dataset.v==='edit'){ o.remove(); openSheet('edit',{walk:w}); } });
  document.body.appendChild(o);
}

/* ---------- setup screens & boot ---------- */
function showKeyScreen(msg=''){
  $('#app').innerHTML=`<div class="setup">${LUNA_FACE}<h1>מטיילים עם לונה</h1><p>הזינו את קוד המשפחה כדי להתחבר</p>
    <form id="keyForm"><input class="inp" id="keyIn" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="קוד משפחה" style="text-align:center;font-size:18px">
    ${msg?`<div class="err">${esc(msg)}</div>`:''}<button class="btn pri wide" style="margin-top:12px">כניסה 🐾</button></form></div>`;
  $('#keyForm').addEventListener('submit',async ev=>{ ev.preventDefault(); const k=$('#keyIn').value.trim(); if(!k) return;
    Store.connect(k);
    try{ if(await Store.checkKey()){ LS.set('luna_family_key',k); boot(); } else showKeyScreen('הקוד לא נכון 🙈'); }
    catch(err){ showKeyScreen('בעיית חיבור: '+(err.message||err)); } });
}
function showMeScreen(){
  $('#app').innerHTML=`<div class="setup">${LUNA_FACE}<h1>היי! מי את/ה?</h1><p>ככה נדע מי מוציא את לונה מהטלפון הזה</p>
    <div class="who-grid">${WALKERS.map(p=>`<button data-pickme="${p.id}"><span class="avatar big" style="background:${p.color}">${esc(p.name[0])}</span>${esc(p.name)}</button>`).join('')}</div></div>`;
  document.querySelectorAll('[data-pickme]').forEach(b=>b.addEventListener('click',()=>{ state.me=b.dataset.pickme; LS.set('luna_me',state.me); startApp(); }));
}
async function boot(){
  if(Store.configured()){
    const k=LS.get('luna_family_key',null); if(!k) return showKeyScreen();
    Store.connect(k, LS.get('luna_parent_key',null));
    try{ if(!await Store.checkKey()){ LS.del('luna_family_key'); return showKeyScreen('הקוד השתנה – הזינו מחדש'); } }
    catch(err){ state.err='בעיית חיבור: '+(err.message||err); }
  }
  state.me=LS.get('luna_me',null);
  if(!state.me) return showMeScreen();
  startApp();
}
async function startApp(){
  render(); await refresh();
  clearInterval(timerId); timerId=setInterval(tick,1000);
  clearInterval(pollId); pollId=setInterval(()=>{ if(!document.hidden && !sheet) refresh(); },30000);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && state.me && !sheet) refresh(); });
boot();
</script>
